<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Timetable">
  <!--
    The week meter, the mark the explorer is built around: teaching weeks as
    bars, with a gap where a class does not run. Deep navy reads on both a
    light and a dark browser tab.
  -->
  <rect width="32" height="32" rx="6" fill="#0D1B2A"/>
  <g fill="#E3AC46">
    <rect x="5"  y="8" width="4" height="16" rx="1"/>
    <rect x="11" y="8" width="4" height="16" rx="1"/>
    <rect x="17" y="8" width="4" height="16" rx="1" fill="#3A4A59"/>
    <rect x="23" y="8" width="4" height="16" rx="1"/>
  </g>
</svg>
